<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>Calf Doctor</title>
<style>:root {
  --bg: #f4f1ea;
  --card: #ffffff;
  --ink: #1c1917;
  --muted: #6b645c;
  --line: #ddd6cb;
  --accent: #14532d;
  --accent-2: #166534;
  --warn-bg: #fef3c7;
  --warn-line: #d97706;
  --err-bg: #fee2e2;
  --err-line: #dc2626;
  --cnt: #0e7490;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 18px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input, select, textarea { font: inherit; color: inherit; }

header.top {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: var(--accent); color: #fff;
}
.brand { font-weight: 800; font-size: 20px; letter-spacing: .2px; }
.badge { font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.18); }
.badge.off { background: #b45309; }
.badge.sync { background: #a16207; }
.badge.demo { background: #7c2d12; }
.demo-bar { background: #7c2d12; color: #fff; font-size: 14px; padding: 6px 16px; }

main { max-width: 680px; margin: 0 auto; padding: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.lbl { display: block; font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 6px 0 8px; }
.card > .lbl:first-child { margin-top: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .input { flex: 1; }
.stack { display: grid; gap: 10px; width: 100%; max-width: 360px; }

.input {
  width: 100%; min-height: 54px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px;
  background: #fff; font-size: 20px;
}
.input:focus { outline: none; border-color: var(--accent-2); }
textarea.input { font-size: 17px; min-height: 0; }
.tagnum, .temp { font-size: 30px; font-weight: 800; letter-spacing: 1px; margin-top: 10px; }
.temp { margin-top: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 52px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line);
  background: #fff; font-weight: 700; font-size: 17px;
}
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip.cnt { border-color: var(--cnt); color: var(--cnt); }
.chip.cnt.on { background: var(--cnt); color: #fff; }
.chip.danger { border-color: #b91c1c; color: #b91c1c; }
.chip.danger.on { background: #b91c1c; color: #fff; }
.chip.color { display: inline-flex; align-items: center; gap: 8px; }
.swatch { width: 22px; height: 22px; border-radius: 6px; border: 2px solid rgba(0,0,0,.25); display: inline-block; }

.btn {
  min-height: 52px; padding: 10px 18px; border-radius: 12px; border: 2px solid var(--ink);
  background: #fff; font-weight: 800;
}
.btn.small { min-height: 40px; padding: 6px 12px; font-size: 15px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { background: #fff; border-color: #b91c1c; color: #b91c1c; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.big { width: 100%; max-width: 360px; min-height: 60px; font-size: 20px; }
.btn:disabled { opacity: .5; }
.save-row { display: flex; gap: 10px; margin: 4px 0 14px; }
.btn.save { flex: 1; min-height: 68px; font-size: 24px; background: var(--accent); border-color: var(--accent); color: #fff; }
.link { background: none; border: 0; color: var(--accent-2); font-weight: 800; text-decoration: underline; padding: 0; }

.loc-bar {
  width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; font-weight: 700;
}
.edit-bar { display: flex; justify-content: space-between; gap: 8px; background: var(--warn-bg); border: 2px solid var(--warn-line); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; font-weight: 700; }

.voice .mic {
  width: 100%; min-height: 84px; border-radius: 16px; border: 0; background: var(--ink); color: #fff;
  display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 22px; font-weight: 800; margin-bottom: 10px;
}
.voice .mic.live { background: #b91c1c; animation: pulse 1.2s infinite; }
.mic-icon { font-size: 30px; }
@keyframes pulse { 50% { opacity: .82; } }
.heard { min-height: 1.3em; margin: 4px 0 10px; font-size: 17px; }
.confirm-bar { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: #dcfce7; border: 2px solid var(--accent-2); font-weight: 800; }

.history { background: #f8f6f2; border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
.hist-line { font-size: 16px; padding: 3px 0; }
.hist-line.dead { color: #b91c1c; font-weight: 800; }
.new-calf { margin-top: 8px; }
.suggest {
  width: 100%; text-align: left; margin-top: 10px; padding: 12px; border-radius: 10px;
  border: 2px dashed var(--accent-2); background: #f0fdf4;
}
.warn { background: var(--warn-bg); border: 2px solid var(--warn-line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-weight: 600; }
.warn > div + div { margin-top: 4px; }
.error { background: var(--err-bg); border: 2px solid var(--err-line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-weight: 700; }

.list { display: grid; gap: 8px; }
.entry { text-align: left; width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 12px; }
.entry.dead { border-left: 6px solid #b91c1c; }
.entry.cnt { border-left: 6px solid var(--cnt); }
.entry-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }

.tag-summary { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.big-tag { font-size: 28px; font-weight: 900; }
.pill { padding: 4px 10px; border-radius: 999px; background: #e7e5e4; font-weight: 800; font-size: 15px; }
.pill.dead { background: #fee2e2; color: #b91c1c; }

.seg { display: flex; gap: 6px; background: #e7e2d8; padding: 4px; border-radius: 12px; margin-bottom: 12px; }
.seg-btn { flex: 1; min-height: 46px; border: 0; border-radius: 9px; background: transparent; font-weight: 800; }
.seg-btn.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.tile { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.tile-v { font-size: 30px; font-weight: 900; }
.tile-l { font-weight: 700; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 16px; }
th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 13px; color: var(--muted); text-transform: uppercase; }
td.good { color: var(--accent-2); font-weight: 800; }
td.bad { color: #b91c1c; font-weight: 800; }
td.meh { color: #b45309; font-weight: 800; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 150px; }
.bar-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.bar { width: 100%; background: var(--accent-2); border-radius: 4px 4px 0 0; min-height: 2px; }
.bar-n { font-size: 12px; color: var(--muted); }
.bar-l { font-size: 12px; color: var(--muted); margin-top: 4px; }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.kv { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #f0ece4; font-size: 16px; }

.crew-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f0ece4; flex-wrap: wrap; }
.crew-row.inactive { opacity: .55; }
.add-crew { display: grid; gap: 8px; margin-top: 12px; }
.card .btn + .btn { margin-left: 8px; }

nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: flex;
  background: var(--bg); border-top: 1px solid var(--line);
  padding: 4px 6px calc(4px + env(safe-area-inset-bottom));
  box-shadow: 0 -2px 10px rgba(0,0,0,.05);
}
.tab {
  flex: 1; border: 0; background: none; margin: 0 2px; padding: 6px 0; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 12px; font-weight: 800; color: var(--muted); min-height: 56px;
}
.tab.on { color: var(--accent); background: #e3ecdf; }
.tab-icon { font-size: 22px; line-height: 1; }
body.typing nav.tabs { display: none; }
body.typing { padding-bottom: 16px; }

.center { min-height: 90vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 8px; }
.center h1 { margin: 4px 0; }
.logo { font-size: 64px; }

#toast {
  position: fixed; left: 12px; right: 12px; top: calc(56px + env(safe-area-inset-top)); z-index: 20;
  max-width: 640px; margin: 0 auto; background: #fff; color: var(--ink); border: 2px solid var(--accent-2);
  box-shadow: 0 6px 20px rgba(0,0,0,.15); border-radius: 12px; padding: 12px 14px;
  display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700;
  transform: translateY(-10px); opacity: 0; visibility: hidden; pointer-events: none;
  transition: transform .2s, opacity .2s, visibility 0s .2s;
}
#toast.show { transform: none; opacity: 1; visibility: visible; pointer-events: auto; transition: transform .2s, opacity .2s; }
.toast-btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 800; }

.modal-wrap { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: #fff; width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 85vh; overflow: auto; }
.modal h2 { margin: 0 0 10px; font-size: 22px; }
.modal .input { margin-top: 10px; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.modal-actions .btn { flex: 1; }

.notice { background: #ecfdf5; border: 2px solid #16a34a; border-radius: 10px; padding: 10px 12px; font-weight: 700; color: #14532d; }
.center h2 { margin: 12px 0 0; }
.center .stack .link { justify-self: center; margin-top: 4px; font-size: 17px; }
.muted-link { color: inherit; opacity: .6; }

/* v0.2 */
.saved-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #dcfce7; border: 2px solid var(--accent-2); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; font-size: 16px; }
.pasture { padding: 12px 14px; }
.pasture-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pasture .lbl { margin: 0 0 2px; }
.pasture-name { font-size: 21px; font-weight: 800; }
.lbl-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.lbl-row .lbl { margin: 0; }
.chip.notag, .chip.notemp { min-height: 40px; padding: 6px 12px; font-size: 15px; }
.say-hint { margin: 8px 0 0; }
.voice-help { margin: 0 0 6px; }
.temp-wrap { display: flex; align-items: center; gap: 12px; }
.temp-wrap .temp { flex: 1; }
.temp-preview { font-size: 22px; font-weight: 800; color: var(--accent-2); white-space: nowrap; }
.dose { display: flex; gap: 10px; align-items: baseline; margin-top: 12px; padding: 12px; border-radius: 10px; background: #eff6ff; border: 2px solid #2563eb; font-weight: 700; font-size: 18px; }
.dose-l { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: #1d4ed8; font-weight: 900; }
.dose.none { background: #f8f6f2; border: 1px dashed var(--line); color: var(--muted); font-weight: 600; font-size: 15px; display: block; }
.dose-chart { margin-top: 12px; }
.dose-chart summary { font-weight: 800; color: var(--accent-2); cursor: pointer; padding: 6px 0; }
.dose-chart table { margin-top: 6px; }
.dose-chart td { white-space: normal; font-size: 16px; }
.dose-chart td:first-child { font-weight: 700; width: 45%; }
.dose-grid { display: grid; gap: 8px; margin-bottom: 12px; }
.dose-row { display: grid; gap: 4px; font-weight: 700; font-size: 15px; }
.dose-in { min-height: 46px; font-size: 17px; }
.save-row .btn.save { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.save-sub { font-size: 15px; font-weight: 700; opacity: .85; margin-top: 3px; }
.install { border: 2px solid var(--accent-2); }
.install-top { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.install-icon { width: 48px; height: 48px; border-radius: 11px; }
.install .link { display: block; margin-top: 8px; font-size: 15px; }
.hidden-file { display: none; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-bottom: 10px; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #e7e5e4; display: flex; align-items: center; justify-content: center; text-align: center; }
.thumb img, .thumb video, .thumb a { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-x { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: 20px; line-height: 1; }
.thumb-tag { position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.65); color: #fff; font-size: 12px; font-weight: 800; padding: 2px 6px; border-radius: 6px; pointer-events: none; }

/* v0.3 practice mode */
.practice-bar { position: sticky; top: calc(48px + env(safe-area-inset-top)); z-index: 4; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  background: repeating-linear-gradient(-45deg, #f59e0b 0 16px, #fbbf24 16px 32px); color: #1c1917; padding: 10px 16px; font-size: 16px; line-height: 1.3;
  border-bottom: 3px solid #b45309; }
.practice-bar strong { font-size: 18px; letter-spacing: .5px; }
.btn.practice-off { background: #fff; border: 2px solid #1c1917; color: #1c1917; font-weight: 800; white-space: nowrap; }
/* Practice mode: amber everywhere, so it can't be missed on any screen */
body.practice header.top { background: #b45309; }
body.practice .brand { letter-spacing: 1px; }
body.practice nav.tabs { background: #fef3c7; border-top: 3px solid #f59e0b; }
body.practice::after { content: ''; position: fixed; inset: 0; border: 5px solid #f59e0b; pointer-events: none; z-index: 20; }
body.practice main { background: repeating-linear-gradient(-45deg, transparent 0 40px, rgba(245,158,11,.06) 40px 80px); }
.practice-recover { display: grid; gap: 8px; margin: 10px 0; }
.practice-recover .dates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.practice-recover .dates label { display: grid; gap: 2px; min-width: 0; }
.practice-recover .dates .input { width: 100%; min-width: 0; box-sizing: border-box; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
.btn.save.practice { background: #d97706; border-color: #d97706; }
.practice-card { border: 2px solid #f59e0b; }

/* v0.4 season tag color */
.season-color { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; text-transform: none; letter-spacing: 0; font-weight: 700; color: var(--ink); font-size: 14px; }
.season-color .swatch { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #a8a29e; }

/* ---- calf lifecycle ---- */
.jobs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 8px; }
.job { text-align: left; min-height: 64px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: #fff; display: flex; flex-direction: column; gap: 2px; }
.job.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.job.on .small { color: #e7e5e4; }
.chk { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; font-weight: 700; font-size: 17px; }
.chk input { width: 24px; height: 24px; flex: none; }
.proc-note { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: #eef2ff; border: 2px solid #6366f1; font-size: 16px; }
.chute-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--ink); color: #fff; border-color: var(--ink); }
.chute-head .muted { color: #d6d3d1; }
.chute-head .btn { background: #fff; color: var(--ink); border-color: #fff; }
.chute-title { font-size: 22px; font-weight: 900; }
.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chip.treat { width: 100%; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
.chip.treat.on { background: var(--accent); border-color: var(--accent); }
.warn-text { color: #b45309; font-weight: 700; }
.bulk summary { font-weight: 800; cursor: pointer; }
.batch-row, .count-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f0ece4; flex-wrap: wrap; }
.count-n { font-size: 26px; font-weight: 900; min-width: 48px; text-align: right; }
.check-list { max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; margin-top: 8px; }
.check-list .chk { margin: 6px 0; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin: 6px 0 12px; }
.fact { display: flex; flex-direction: column; gap: 1px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.card .actions .btn + .btn { margin-left: 0; }
.pill.alive { background: #dcfce7; color: var(--accent); }
.entry.life strong { font-size: 17px; }
.pasture-btn.fed { border-left: 6px solid var(--accent-2); }
.fed-line { color: var(--accent-2); font-weight: 700; }
.card .notice { margin: 12px 0; }
.tab { font-size: 11px; margin: 0 1px; }
.tab-icon { font-size: 21px; }
.batch-row > div:first-child, .count-row > div:first-child { flex: 1; min-width: 0; }
.count-row { flex-wrap: nowrap; }
</style>
</head>
